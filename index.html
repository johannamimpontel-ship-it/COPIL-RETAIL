<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COPIL RETAIL — Tableau de bord</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--navy:#1a2744;--blue:#1d4e89;--line:#dfe5ee;--txt:#1f2733;--mut:#5a6677;--green:#1e7d32;--red:#c0392b;--alt:#eef2f9;--chip:#e7edf6;--chipon:#1d4e89;--banner:#b3202a;--bannersub:#f6d6d8;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--surface:#171f2b;--navy:#0c1422;--blue:#2d63a8;--line:#2a3545;--txt:#e6ebf2;--mut:#9aa7b8;--alt:#1c2634;--chip:#22303f;--chipon:#2d63a8;--banner:#8e1b23;--bannersub:#efc9cc}}
html,body{margin:0}body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
header{background:var(--banner);color:#fff;padding:14px 18px;position:sticky;top:env(safe-area-inset-top,0);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);background:var(--banner);z-index:11}
h1{font-size:17px;margin:0 0 3px}.sub{font-size:12px;color:var(--bannersub)}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.ctrl{display:flex;flex-direction:column;gap:4px}.ctrl label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
select{font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--txt);min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--chip);color:var(--txt);cursor:pointer;user-select:none}
.chip.on{background:var(--chipon);color:#fff;border-color:var(--chipon)}
.tg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tg button{font-size:13px;padding:8px 12px;border:0;background:var(--surface);color:var(--mut);cursor:pointer}
.tg button.on{background:var(--blue);color:#fff;font-weight:600}
main{padding:16px 18px;max-width:1120px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .d{font-size:13px;margin-top:2px}
h2{font-size:14px;color:var(--blue);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
thead th{background:var(--navy);color:#fff;font-size:11px}
tbody tr.fam{cursor:pointer}tbody tr.fam:hover{background:var(--chip)}
tbody tr:nth-child(even):not(.sub):not(.tot){background:var(--alt)}
tr.sub td{color:var(--mut);font-size:12px}tr.sub td:first-child{padding-left:28px}
tr.tot td{font-weight:700;background:var(--chip);border-top:2px solid var(--line)}
.g{color:var(--green);font-weight:600}.r{color:var(--red);font-weight:600}
.exp{display:inline-block;width:14px;color:var(--mut);font-size:11px}
.status{padding:40px 18px;text-align:center;color:var(--mut);max-width:1120px;margin:0 auto}
.foot{color:var(--mut);font-size:12px;padding:10px 18px 30px;max-width:1120px;margin:0 auto}
.hint{font-size:11px;color:var(--mut)}
</style></head><body>

function boot(){META=EMBED_META;onMeta();}
function onMeta(){
  if(!META.weeks||!META.weeks.length){status("Aucune donnée.");return}

}
function buildPays(){
  $('pays').innerHTML=PAYSL.map(p=>`<span class="chip ${pays.includes(p)?'on':''}" data-x="${p}">${p[0]+p.slice(1).toLowerCase()}</span>`).join('');

    store='__all__';buildPays();fillStores();render();});
}
function buildPerims(){
  $('perims').innerHTML=Object.keys(PN).map(k=>`<span class="chip ${perims.includes(+k)?'on':''}" data-p="${k}">${PN[k]}</span>`).join('');

}
function loadWeek(id){CUR=EMBED_WEEKS[id]||{stores:[]};fillStores();render();}
function matching(){return (CUR&&CUR.stores||[]).filter(s=>pays.includes(s.pays)&&perims.includes(s.p)&&(lfl?s.c:s.sn))}
function fillStores(){

  $('store').innerHTML=`<option value="__all__">Tous (sélection) — ${ms.length} mag.</option>`+ms.map(m=>`<option value="${m}">${m}</option>`).join('');

function selected(){const ms=matching();return store=='__all__'?ms:ms.filter(s=>s.n==store)}

  return {k,tree};}

  $('secteurs').querySelectorAll('tr.fam').forEach(r=>r.onclick=()=>{openf[r.dataset.k]=!openf[r.dataset.k];render()});
